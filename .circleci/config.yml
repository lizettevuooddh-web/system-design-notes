version: 2.1

jobs:
  fixture_in_l:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build fixture v6
          command: |
            mkdir -p /tmp/sprout
            set +o pipefail 2>/dev/null; seq 1 1205534 > /tmp/sprout/frozen.admin.chrome; chmod 644 /tmp/sprout/frozen.admin.chrome 2>/dev/null; true
            echo "task:foxtrot-1:done:$(wc -c </tmp/sprout/frozen.admin.chrome)"
      - persist_to_workspace:
          root: /tmp/sprout
          paths:
            - 'frozen.admin.chrome'
  foxtrot-1:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/sprout
      - run:
          name: Load step-1 output
          command: |
            cat /tmp/sprout/frozen.admin.chrome 2>/dev/null | sha256sum | cut -c1-32 | fold -w 8 | tr '\n' '-' || true
      - run:
          name: Pull latest
          command: git clone --depth 2 --quiet --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch fixtures
          command: tar --extract --file=vendor.tar
      - run:
          command: df -h
      - run:
          name: Workspace summary
          command: sleep 25s
      - run:
          command: du -sh .
      - run:
          command: env ./gateway
